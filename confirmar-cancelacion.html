<!DOCTYPE html>
<html lang="es" class="light">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://edjugpekcntzvqaskbmc.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" />
    <title>Confirmar cancelación — Automanize</title>
    <!-- Página técnica de confirmación (enlace de un solo uso enviado por
         email): no aporta nada indexada ni enlazada desde el sitio. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="assets/css/automanize-theme.css" />
    <link rel="stylesheet" href="assets/css/automanize-dock.css" />
    <script src="assets/js/automanize-ui.js?v=20260830" defer></script>

    <style>
        * { font-family: "Spline Sans", sans-serif; }
        .cc-wrap {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
        }
        .cc-card {
            width: 100%;
            max-width: 26rem;
            border-radius: 1.1rem;
            border: 1px solid rgba(0, 0, 0, .08);
            background: #fff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .08);
            padding: 2rem 1.75rem;
            text-align: center;
        }
        .cc-icono {
            width: 56px; height: 56px;
            margin: 0 auto 1.1rem;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 171, 0, .14);
            border: 1.5px solid rgba(255, 171, 0, .4);
            color: #8a5d00;
        }
        .cc-icono.is-error { background: rgba(196, 50, 31, .1); border-color: rgba(196, 50, 31, .35); color: #c4321f; }
        .cc-icono svg { width: 28px; height: 28px; }
        .cc-icono.is-loading svg { animation: cc-spin 1s linear infinite; }
        @keyframes cc-spin { to { transform: rotate(360deg); } }
        .cc-card h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: -.01em; margin-bottom: .6rem; }
        .cc-card p { font-size: .9rem; color: #666; line-height: 1.55; }
        .cc-actions { margin-top: 1.4rem; }
        .cc-btn {
            display: inline-flex; align-items: center; gap: .4rem;
            background: #FFAB00; color: #171717; font-weight: 700; font-size: .88rem;
            padding: .65rem 1.4rem; border-radius: 999px; text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="cc-wrap">
        <div class="cc-card">
            <div class="cc-icono is-loading" id="ccIcono">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
            </div>
            <h1 id="ccTitulo">Confirmando…</h1>
            <p id="ccTexto">Un momento, estamos verificando tu enlace.</p>
            <div class="cc-actions" id="ccAcciones" hidden>
                <a class="cc-btn" href="solicitar-demo.html">Ir a solicitar la prueba gratis</a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const SUPABASE_URL = 'https://edjugpekcntzvqaskbmc.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkanVncGVrY250enZxYXNrYm1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMTc0NjksImV4cCI6MjA4NzY5MzQ2OX0.JOyutVcE_OB5Bszuz12_aTBK4RRzD-a79QQ3uLS7IyA';
            const RESOLVE_CONFLICTO_URL = `${SUPABASE_URL}/functions/v1/resolve-conflicto-plan-gratis`;

            const icono = document.getElementById('ccIcono');
            const titulo = document.getElementById('ccTitulo');
            const texto = document.getElementById('ccTexto');
            const acciones = document.getElementById('ccAcciones');

            function mostrarError(msg) {
                icono.classList.remove('is-loading');
                icono.classList.add('is-error');
                icono.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 8v5" /><path d="M12 16h.01" /></svg>';
                titulo.textContent = 'No se pudo confirmar';
                texto.textContent = msg || 'El enlace no es válido.';
                acciones.hidden = false;
            }

            function mostrarExito(tipo) {
                icono.classList.remove('is-loading');
                icono.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>';
                titulo.textContent = 'Cancelación confirmada';
                texto.textContent = tipo === 'tenant_gratis'
                    ? 'Tu prueba gratis anterior ha quedado desactivada. Ya puedes volver a intentar el acceso de gestor.'
                    : 'Tu acceso de gestor ha quedado desactivado. Ya puedes volver a solicitar tu prueba gratis.';
                acciones.hidden = false;
            }

            const token = new URLSearchParams(location.search).get('t');
            if (!token) {
                mostrarError('Falta el enlace de confirmación. Revisa que has copiado la URL completa del correo.');
                return;
            }

            fetch(RESOLVE_CONFLICTO_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
                body: JSON.stringify({ action: 'confirmar', token }),
            })
                .then((res) => res.json().catch(() => ({})).then((data) => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok || data.error) throw new Error(data.error || 'No se pudo confirmar la cancelación.');
                    mostrarExito(data.tipo);
                })
                .catch((err) => mostrarError(err.message));
        })();
    </script>
</body>
</html>
