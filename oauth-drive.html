  <div class="box" id="msg">Conectando con Google…</div>
  <script>
    // Página de retorno del OAuth de Google (Drive y Calendar) para automanize.com/app.
    // Solo reenvía el código a la ventana que la abrió (mismo origen) y se
    // cierra: quien canjea el código es la Edge Function drive-connect o calendar-token.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var payload = {
        source: 'nize-drive-oauth',
        state: params.get('state') || '',
        code: params.get('code') || '',
        error: params.get('error_description') || params.get('error') || '',
      };

      if (!window.opener) {
        document.getElementById('msg').innerHTML = '<p class="err">Abre esta página desde Nize.</p>';
        return;
      }

      window.opener.postMessage(payload, window.location.origin);
      document.getElementById('msg').textContent = payload.error
        ? 'No se pudo conectar. Puedes cerrar esta ventana.'
        : 'Listo. Puedes cerrar esta ventana.';
      setTimeout(function () { window.close(); }, 800);
    })();
  </script>
