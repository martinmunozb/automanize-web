<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Automatización de leads</title>
<!-- internal-leads.js y .css son copia exacta de automanize-web/assets. Estas reglas son las de panel-interno.html que usan. -->
<link id="internalLeadsStyles" rel="stylesheet" href="./internal-leads.css?v=20261104" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #f7f7f8; color: #111; padding: 20px; }
  a { color: inherit; }
  label.field-label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e8e8e8; border-radius: 9px;
    font-size: 14px; font-family: inherit; outline: none; background: white; color: #111;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="checkbox"], input[type="radio"] { width: auto; }
  input:focus, select:focus, textarea:focus { border-color: #EAB308; box-shadow: 0 0 0 3px rgba(234,179,8,0.12); }
  .field { margin-bottom: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 18px; border-radius: 9px; font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; border: none; transition: all 0.15s;
  }
  .btn-primary { background: #111; color: white; }
  .btn-primary:hover:not(:disabled) { background: #333; }
  .btn-accent { background: #EAB308; color: #111; }
  .btn-accent:hover { background: #d4a107; }
  .btn-ghost { background: transparent; color: #666; border: 1.5px solid #e8e8e8; }
  .btn-ghost:hover { border-color: #ccc; color: #111; }
  .btn-danger { background: #fff1f2; color: #b91c1c; }
  .btn-danger:hover { background: #fee2e2; }
  .btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 7px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .stat-card { background: white; border: 1px solid #eee; border-radius: 14px; padding: 18px 20px; }
  .stat-label { font-size: 11.5px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .stat-value { font-size: 26px; font-weight: 800; }
  .stat-value.ok { color: #15803d; }
  .stat-value.bad { color: #b91c1c; }
  .section { display: none; }
  .section.active { display: block; }
  table.data-table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #eee; border-radius: 12px; overflow: hidden; }
  table.data-table th {
    text-align: left; font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 12px 14px; background: #fafafa; border-bottom: 1px solid #eee;
  }
  table.data-table td { padding: 12px 14px; font-size: 13.5px; border-bottom: 1px solid #f3f3f3; vertical-align: middle; }
  table.data-table tr:last-child td { border-bottom: none; }
  table.data-table tr:hover td { background: #fafafa; }
</style>
</head>
<body>
  <div class="section active"><div id="internalLeadsRoot" aria-live="polite"></div></div>
  <script src="./internal-leads.js?v=20261104"></script>
</body>
</html>
