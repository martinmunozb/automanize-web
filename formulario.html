<head>

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #F7F5F0;
      --surface:     #FFFFFF;
      --surface2:    #F2EFE8;
      --border:      #E5E1D6;
      --accent:      #D9A404;
      --accent-h:    #C29103;
      --accent-dim:  rgba(217,164,4,0.10);
      --accent-ring: rgba(217,164,4,0.28);
      --text:        #1A1815;
      --muted:       #837C6C;
      --light:       #BDB6A4;
      --error:       #DC2626;
      --error-bg:    rgba(220,38,38,0.06);
      --shadow:      0 20px 45px -12px rgba(60,50,20,0.16);
    }

    html, body {
      min-height: 100vh; color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif; font-size: 16px;
      background-color: var(--bg);
      background-image:
        radial-gradient(620px circle at 12% -8%, rgba(217,164,4,0.14), transparent 60%),
        radial-gradient(520px circle at 110% 15%, rgba(217,164,4,0.08), transparent 60%),
        radial-gradient(rgba(30,25,10,0.05) 1px, transparent 1px);
      background-size: auto, auto, 26px 26px;
      background-repeat: no-repeat, no-repeat, repeat;
      background-attachment: fixed, fixed, fixed;
    }
    #app { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Spinner ── */
    .spinner { width: 36px; height: 36px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Screens: loading / error / success ── */
    .screen-center {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 40px 28px; gap: 12px;
      animation: screenIn .5s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .screen-icon {
      width: 58px; height: 58px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px; color: var(--accent);
      background: var(--accent-dim); border: 1px solid var(--accent-ring);
    }
    .screen-icon svg { width: 30px; height: 30px; stroke: currentColor; }
    .screen-center h2 { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 22px; }
    .screen-center p  { font-size: 15px; color: var(--muted); line-height: 1.65; max-width: 280px; }

    /* ── Success screen ── */
    @keyframes popIn {
      0%   { opacity: 0; transform: scale(.6); }
      70%  { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes ringPulse {
      0%   { transform: scale(.9); opacity: .55; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    .success-badge {
      position: relative; width: 88px; height: 88px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .success-badge-ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: var(--accent-dim); border: 1px solid var(--accent-ring);
      animation: ringPulse 1.8s ease-out .4s infinite;
    }
    .success-badge-icon {
      position: relative; width: 72px; height: 72px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      background: radial-gradient(circle at 30% 30%, var(--accent-dim), var(--surface2));
      border: 1px solid var(--border);
      box-shadow: 0 0 0 4px var(--bg);
    }
    .success-badge-icon svg { width: 34px; height: 34px; stroke: currentColor; }
    .success-title {
      font-family: 'Inter', sans-serif; font-weight: 800; font-size: 24px;
      color: var(--text); margin-top: 4px;
    }
    .success-text { font-size: 15px; color: var(--muted); }
    .success-next {
      display: flex; align-items: center; gap: 8px;
      margin-top: 8px; padding: 12px 18px; max-width: 300px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 999px;
      font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4;
    }
    .success-next-dot {
      flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim);
    }

    /* ── Header ── */
    .wizard-head {
      padding: 20px 20px 0;
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .wizard-brand-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .wizard-brand {
      font-family: 'Inter', sans-serif; font-weight: 800;
      font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted);
      animation: fadeIn .5s cubic-bezier(.16,1,.3,1) both;
    }
    .wizard-brand span { color: var(--accent); }
    .wizard-step-label {
      font-size: 11px; font-weight: 700; color: var(--light);
      letter-spacing: .04em; white-space: nowrap; flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .wizard-progress-track { height: 3px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .wizard-progress-fill {
      height: 100%; background: var(--accent); border-radius: 999px;
      transition: width .5s cubic-bezier(.16,1,.3,1);
    }

    /* ── Wizard layout ── */
    .wizard { flex: 1; display: flex; flex-direction: column; max-width: 540px; width: 100%; margin: 0 auto; }
    .wizard-body {
      flex: 1; padding: 20px 16px 16px; display: flex; flex-direction: column;
      justify-content: center; overflow: hidden;
    }

    .step-card {
      display: flex; flex-direction: column; gap: 18px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
      padding: 30px 24px 26px; box-shadow: var(--shadow);
      animation: slideInFwd .42s cubic-bezier(.16,1,.3,1) both;
    }
    .step-card.dir-back { animation-name: slideInBack; }
    .step-card.no-anim { animation: none; }
    .step-card.no-anim .step-icon { animation: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    @keyframes slideInFwd  { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
    @keyframes slideInBack { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

    .step-icon {
      width: 46px; height: 46px; border-radius: 13px;
      background: var(--accent-dim); border: 1px solid var(--accent-ring);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); margin-bottom: 2px;
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .step-icon svg { width: 22px; height: 22px; stroke: currentColor; }

    .step-q {
      font-family: 'Inter', sans-serif; font-weight: 800;
      font-size: clamp(19px, 5vw, 24px); line-height: 1.3;
      color: var(--text); text-wrap: balance;
    }
    .step-sub {
      font-size: 14px; color: var(--muted); line-height: 1.55;
      margin-top: -10px;
    }
    .input-area { display: flex; flex-direction: column; gap: 8px; }

    /* ── Text / Number / Email ── */
    input[type="text"],
    input[type="number"],
    input[type="email"] {
      width: 100%; padding: 16px 16px; font-size: 16px;
      font-family: 'Inter', sans-serif;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); transition: border-color .2s cubic-bezier(.16,1,.3,1), box-shadow .2s cubic-bezier(.16,1,.3,1);
      -webkit-appearance: none; appearance: none;
    }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
    input::placeholder { color: var(--light); }

    /* ── Phone + prefix ── */
    .phone-group { display: flex; gap: 8px; }
    .phone-group select {
      flex: 0 0 auto; padding: 16px 10px; font-size: 15px;
      font-family: 'Inter', sans-serif;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); -webkit-appearance: none; appearance: none;
      transition: border-color .2s cubic-bezier(.16,1,.3,1);
    }
    .phone-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
    .phone-group input[type="tel"] {
      flex: 1; width: 100%; padding: 16px 16px; font-size: 16px;
      font-family: 'Inter', sans-serif;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); -webkit-appearance: none; appearance: none;
      transition: border-color .2s cubic-bezier(.16,1,.3,1);
    }
    .phone-group input[type="tel"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

    /* ── Opciones: entrada escalonada compartida ── */
    @keyframes optIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

    /* ── Single select ── */
    .opt {
      display: flex; align-items: center; gap: 14px;
      padding: 15px 16px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer; font-size: 15px; font-family: 'Inter', sans-serif;
      color: var(--text); text-align: left; width: 100%;
      min-height: 52px;
      animation: optIn .38s cubic-bezier(.16,1,.3,1) both;
      transition: border-color .18s cubic-bezier(.16,1,.3,1), background .18s cubic-bezier(.16,1,.3,1),
                  transform .18s cubic-bezier(.16,1,.3,1), box-shadow .18s cubic-bezier(.16,1,.3,1);
    }
    .opt:hover { border-color: var(--muted); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.28); }
    .opt:active { transform: translateY(0) scale(.98); box-shadow: none; }
    .opt.sel { border-color: var(--accent); background: var(--accent-dim); }
    .opt-dot {
      width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 50%;
      flex-shrink: 0; transition: border-color .18s cubic-bezier(.16,1,.3,1), background .18s cubic-bezier(.16,1,.3,1);
    }
    .opt.sel .opt-dot { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--surface2); }

    /* ── Multi select ── */
    .chk {
      display: flex; align-items: center; gap: 14px;
      padding: 15px 16px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer; font-size: 15px; font-family: 'Inter', sans-serif;
      color: var(--text); text-align: left; width: 100%;
      min-height: 52px;
      animation: optIn .38s cubic-bezier(.16,1,.3,1) both;
      transition: border-color .18s cubic-bezier(.16,1,.3,1), background .18s cubic-bezier(.16,1,.3,1),
                  transform .18s cubic-bezier(.16,1,.3,1), box-shadow .18s cubic-bezier(.16,1,.3,1);
    }
    .chk:hover { border-color: var(--muted); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.28); }
    .chk:active { transform: translateY(0) scale(.98); box-shadow: none; }
    .chk.sel { border-color: var(--accent); background: var(--accent-dim); }
    .chk-box {
      width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 5px;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: border-color .18s cubic-bezier(.16,1,.3,1), background .18s cubic-bezier(.16,1,.3,1), transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    .chk.sel .chk-box { border-color: var(--accent); background: var(--accent); transform: scale(1.05); }
    .chk.sel .chk-box::after {
      content: ''; display: block; width: 4px; height: 8px;
      border: 2px solid #000; border-top: none; border-left: none;
      transform: rotate(45deg) translate(-1px,-1px);
    }

    /* ── Boolean — tarjetas grandes ── */
    .bool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .bool-btn {
      padding: 24px 12px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer; font-size: 16px; font-family: 'Inter', sans-serif;
      font-weight: 700; text-align: center; color: var(--text); line-height: 1.3;
      min-height: 80px; display: flex; align-items: center; justify-content: center;
      animation: optIn .38s cubic-bezier(.16,1,.3,1) both;
      transition: border-color .18s cubic-bezier(.16,1,.3,1), background .18s cubic-bezier(.16,1,.3,1),
                  transform .18s cubic-bezier(.16,1,.3,1), box-shadow .18s cubic-bezier(.16,1,.3,1), color .18s;
    }
    .bool-btn:hover { border-color: var(--muted); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.28); }
    .bool-btn:active { transform: translateY(0) scale(.97); box-shadow: none; }
    .bool-btn.sel { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

    /* ── Empty ── */
    .no-opts { font-size: 14px; color: var(--muted); padding: 12px 0; }

    /* ── Error ── */
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }
    .field-err {
      font-size: 13px; color: var(--error);
      background: var(--error-bg); border-radius: 10px;
      padding: 10px 14px; border: 1px solid rgba(248,113,113,0.15);
      animation: shake .4s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* ── Consentimiento RGPD ── */
    .privacy-consent { display: flex; flex-direction: column; gap: 10px; }
    .privacy-text {
      font-size: 12.5px; line-height: 1.6; color: var(--muted);
    }
    .privacy-text a, .privacy-chk a {
      color: var(--accent); text-decoration: underline; text-underline-offset: 2px;
    }
    .privacy-chk { min-height: 0; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
    .privacy-chk .chk-box { margin-top: 2px; }

    /* ── Nav ── */
    .wizard-nav {
      padding: 14px 20px max(24px, env(safe-area-inset-bottom));
      display: flex; gap: 10px;
      background: var(--bg); border-top: 1px solid var(--border);
      position: sticky; bottom: 0;
    }
    .btn-back {
      flex: 0 0 auto; padding: 0 20px; height: 52px;
      background: transparent; border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 600;
      color: var(--muted); cursor: pointer;
      transition: border-color .18s cubic-bezier(.16,1,.3,1), color .18s cubic-bezier(.16,1,.3,1), transform .18s cubic-bezier(.16,1,.3,1);
    }
    .btn-back:hover { border-color: var(--muted); color: var(--text); }
    .btn-back:active { transform: scale(.97); }
    .btn-next {
      flex: 1; height: 52px;
      background: var(--accent); border: none; border-radius: 10px;
      font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: #000; cursor: pointer; position: relative;
      transition: background .18s cubic-bezier(.16,1,.3,1), transform .18s cubic-bezier(.16,1,.3,1), box-shadow .18s cubic-bezier(.16,1,.3,1);
    }
    .btn-next:hover:not(:disabled) { background: var(--accent-h); box-shadow: 0 8px 22px rgba(240,192,0,.22); }
    .btn-next:active:not(:disabled) { transform: scale(.98); box-shadow: none; }
    .btn-next:disabled { opacity: .45; cursor: not-allowed; }
    .btn-next.loading { color: transparent; }
    /* Dentro de .step-card (columna) el botón no debe crecer para llenar el alto */
    .btn-next-inline { flex: 0 0 auto; }
    .btn-next.loading::after {
      content: ''; position: absolute; width: 18px; height: 18px;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      border: 2px solid rgba(0,0,0,.25); border-top-color: #000;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
  </style>

  const STEP_ICONS = {
    text: ICONS.pen,
    number: ICONS.numbers,
    single_select: ICONS.list,
    multi_select: ICONS.check,
    dynamic_zone_multi_select: ICONS.pin,
    boolean: ICONS.question,
    phone_prefix: ICONS.phone,
  };

  // ─── API helpers ────────────────────────────────────────────────────────────

  const BASE_HEADERS = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json',
  };

  async function sbGet(table, qs) {
    const url = new URL(`${SUPABASE_URL}/rest/v1/${table}`);
    Object.entries(qs).forEach(([k, v]) => url.searchParams.set(k, v));
    const r = await fetch(url.toString(), { headers: BASE_HEADERS });
    if (!r.ok) { const t = await r.text(); throw new Error(`GET ${table}: ${r.status} ${t}`); }
    return r.json();
  }

  async function sbRpc(fn, params) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: BASE_HEADERS,
      body: JSON.stringify(params),
    });
    if (!r.ok) { const t = await r.text(); throw new Error(`RPC ${fn}: ${r.status} ${t}`); }
    // Las RPC que devuelven void responden 204 sin cuerpo: r.json() petaría con
    // "Unexpected end of JSON input" aunque la escritura en BD haya ido bien
    // (es lo que hacía que registrar_estado_webhook_formulario acabara siempre
    // marcando el aviso como 'error' pisando el 'enviado' correcto).
    const cuerpo = await r.text();
    return cuerpo ? JSON.parse(cuerpo) : null;
  }

  // ─── State ───────────────────────────────────────────────────────────────────

  const S = {
    screen:     'loading', // loading | error | wizard | success
    errorKey:   '',        // notfound | expired | used | generic
    mode:       'token',   // token (lead ya identificado por WhatsApp) | public (link compartido, ej. Idealista)
    tenantName: '',
    tenantEmail: '',
    tenantId:   null,
    telefono:   null,
    tieneWhatsapp: true,
    token:      null,
    steps:      [],        // [{clave, campo_clientes, textoMostrar, tipo_input, opciones}]
    step:       0,
    direction:  'fwd',     // fwd | back — controla el sentido de la transición entre pasos
    answers:    {},        // { campo_clientes → value }
    submitting: false,
    fieldErr:   '',
    privacyAccepted: false,
  };

  // ─── Render ──────────────────────────────────────────────────────────────────

  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function isValidEmail(value) {
    const email = String(value ?? '').trim();
    if (!email || /[\s,;<>]/.test(email) || email.includes('..')) return false;

    const parts = email.split('@');
    if (parts.length !== 2) return false;

    const [local, domain] = parts;
    if (!/^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+$/.test(local) || local.startsWith('.') || local.endsWith('.')) return false;

    const labels = domain.split('.');
    return labels.length >= 2 && labels.every(label => /^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$/.test(label));
  }

  function successFollowUp(tieneWhatsapp) {
    return tieneWhatsapp
      ? 'Te avisaremos por WhatsApp en cuanto tengamos opciones para ti'
      : 'Te enviaremos las opciones disponibles a tu correo';
  }

  function render() {
    if      (S.screen === 'loading') renderLoading();
    else if (S.screen === 'error')   renderError();
    else if (S.screen === 'wizard')  renderWizard();
    else if (S.screen === 'success') renderSuccess();
  }

  function renderLoading() {
    app.innerHTML = `<div class="screen-center"><div class="spinner"></div><p style="color:var(--muted);font-size:14px">Cargando tu formulario…</p></div>`;
  }

  function renderSuccess() {
    app.innerHTML = `
      <div class="screen-center success-screen">
        <div class="success-badge">
          <span class="success-badge-ring"></span>
          <span class="success-badge-icon">${ICONS.home}</span>
        </div>
        <h2 class="success-title">¡Solicitud enviada!</h2>
        <p class="success-text">Hemos recibido todos tus datos.</p>
        <div class="success-next">
          <span class="success-next-dot"></span>
          ${esc(successFollowUp(S.tieneWhatsapp))}
        </div>
      </div>`;
  }

  function renderError() {
    const map = {
      notfound: [ICONS.link, 'Enlace no válido',   'Este enlace no existe o ha sido eliminado. Pide a la inmobiliaria que te reenvíe el formulario.'],
      expired:  [ICONS.clock, 'Enlace caducado',     'Este formulario ya no está disponible. Contacta con la inmobiliaria para recibir uno nuevo.'],
      used:     [ICONS.check, 'Ya completado',       'Ya habías enviado este formulario. Pronto recibirás respuesta de la inmobiliaria.'],
      generic:  [ICONS.alert, 'Algo ha fallado',    'No hemos podido cargar el formulario. Inténtalo de nuevo más tarde.'],
    };
    const [icon, title, body] = map[S.errorKey] ?? map.generic;
    app.innerHTML = `
      <div class="screen-center">
        <div class="screen-icon">${icon}</div>
        <h2>${esc(title)}</h2>
        <p>${esc(body)}</p>
      </div>`;
  }

  function visibleSteps() {
    return S.steps.filter(s => {
      if (s.clave === 'aval_ingreso' && S.answers['tieneAval'] === 'false') return false;
      return true;
    });
  }

  // Pasos con teclado: el botón va pegado al campo para no tener que
  // cerrar el teclado y bajar hasta el final de la pantalla.
  const KEYBOARD_STEP_TYPES = ['text', 'number', 'phone_prefix', 'email'];

  function renderWizard() {
    const steps    = visibleSteps();
    const step     = steps[S.step];
    if (!step) return;

    const total    = steps.length;
    const isLast   = S.step === total - 1;
    const inlineBtn = KEYBOARD_STEP_TYPES.includes(step.tipo_input);
    const showNav   = S.step > 0 || !inlineBtn;
    const pct       = Math.round(((S.step + 1) / total) * 100);

    const nextBtn = (extraClass = '') => `
      <button class="btn-next${extraClass}${S.submitting ? ' loading' : ''}" id="bNext" ${S.submitting ? 'disabled' : ''}>
        ${isLast ? 'Enviar' : 'Continuar →'}
      </button>`;

    app.innerHTML = `
      <div class="wizard">
        <div class="wizard-head">
          <div class="wizard-brand-row">
            <div class="wizard-brand">${esc(S.tenantName)} <span>·</span> Solicitud</div>
            <div class="wizard-step-label">${S.step + 1} / ${total}</div>
          </div>
          <div class="wizard-progress-track"><div class="wizard-progress-fill" style="width:${pct}%"></div></div>
        </div>

        <div class="wizard-body">
          <div class="step-card${S.direction === 'back' ? ' dir-back' : ''}${S.skipEnterAnim ? ' no-anim' : ''}">
            <div class="step-icon">${STEP_ICONS[step.tipo_input] || ICONS.message}</div>
            <div class="step-q">${esc(step.textoMostrar)}</div>
            ${step.subtext ? `<div class="step-sub">${esc(step.subtext)}</div>` : ''}
            <div class="input-area" id="ia">${renderField(step)}</div>
            ${isLast ? renderPrivacyConsent() : ''}
            ${S.fieldErr ? `<div class="field-err">${esc(S.fieldErr)}</div>` : ''}
            ${inlineBtn ? nextBtn(' btn-next-inline') : ''}
          </div>
        </div>

        ${showNav ? `
        <div class="wizard-nav">
          ${S.step > 0 ? `<button class="btn-back" id="bBack">← Atrás</button>` : ''}
          ${inlineBtn ? '' : nextBtn()}
        </div>` : ''}
      </div>`;

    S.skipEnterAnim = false;
    bindField(step);
    document.getElementById('bNext')?.addEventListener('click', () => onNext(step, isLast));
    document.getElementById('bBack')?.addEventListener('click', onBack);
    // Autofocus el campo de teclado del paso actual
    document.getElementById('field')?.focus();
    document.getElementById('telefonoNum')?.focus();

    if (isLast) {
      const chk = document.getElementById('privacyCheckbox');
      chk?.addEventListener('click', () => {
        S.privacyAccepted = !S.privacyAccepted;
        if (S.privacyAccepted) S.fieldErr = '';
        S.skipEnterAnim = true;
        render();
      });
      chk?.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chk.click(); }
      });
    }
  }

  function renderPrivacyConsent() {
    const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.tenantEmail || '');
    const emailHtml = isEmail
      ? `<a href="mailto:${esc(S.tenantEmail)}">${esc(S.tenantEmail)}</a>`
      : (S.tenantEmail ? esc(S.tenantEmail) : 'la inmobiliaria');
    return `
      <div class="privacy-consent">
        <p class="privacy-text">
          Tus datos serán tratados por <strong>${esc(S.tenantName)}</strong> con la finalidad de gestionar
          tu solicitud de alquiler y contactarte por WhatsApp, email o teléfono. Puedes ejercer tus derechos
          de acceso, rectificación y supresión escribiendo a ${emailHtml}. Más información en nuestra
          <a href="https://automanize.com/nize-privacy.html#captacion-leads" target="_blank" rel="noopener noreferrer">Política de Privacidad</a>.
        </p>
        <div class="chk privacy-chk${S.privacyAccepted ? ' sel' : ''}" id="privacyCheckbox" role="checkbox" aria-checked="${S.privacyAccepted}" tabindex="0">
          <span class="chk-box"></span>
          <span>He leído y acepto la <a href="https://automanize.com/nize-privacy.html#captacion-leads" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Política de Privacidad</a>.</span>
        </div>
      </div>`;
  }

  function renderField(step) {
    const val = S.answers[step.campo_clientes];

    switch (step.tipo_input) {
      case 'text':
        return `<input id="field" type="text" value="${esc(val ?? '')}" placeholder="Escribe aquí…" autocomplete="off" />`;

      case 'number':
        return `<input id="field" type="number" value="${val ?? ''}" placeholder="0" inputmode="numeric" />`;

      case 'single_select':
        if (!step.opciones.length) return `<p class="no-opts">Sin opciones disponibles.</p>`;
        return step.opciones.map((o, i) => `
          <button class="opt${val === o.value ? ' sel' : ''}" data-v="${esc(o.value)}" style="animation-delay:${i * 40}ms">
            <span class="opt-dot"></span>${esc(o.label)}
          </button>`).join('');

      case 'multi_select':
      case 'dynamic_zone_multi_select': {
        if (!step.opciones.length) return `<p class="no-opts">No hay opciones disponibles.</p>`;
        const sel = val ? val.split(',').map(s => s.trim()) : [];
        return step.opciones.map((o, i) => `
          <button class="chk${sel.includes(o.value) ? ' sel' : ''}" data-v="${esc(o.value)}" style="animation-delay:${i * 40}ms">
            <span class="chk-box"></span>${esc(o.label)}
          </button>`).join('');
      }

      case 'boolean':
        if (!step.opciones.length) return `<p class="no-opts">Sin opciones.</p>`;
        return `<div class="bool-grid">${step.opciones.map((o, i) => `
          <button class="bool-btn${val === o.value ? ' sel' : ''}" data-v="${esc(o.value)}" style="animation-delay:${i * 40}ms">${esc(o.label)}</button>`
        ).join('')}</div>`;

      case 'phone_prefix': {
        const prefijo = S.answers.__prefijo ?? PREFIJOS[0].value;
        const numero  = S.answers.__telefonoNum ?? '';
        return `
          <div class="phone-group">
            <select id="prefijo">
              ${PREFIJOS.map(p => `<option value="${esc(p.value)}"${p.value === prefijo ? ' selected' : ''}>${esc(p.label)}</option>`).join('')}
            </select>
            <input id="telefonoNum" type="tel" inputmode="numeric" placeholder="6XX XXX XXX" value="${esc(numero)}" />
          </div>`;
      }

      case 'email': {
        const val = S.answers.__email ?? '';
        return `<input id="field" type="email" inputmode="email" placeholder="tucorreo@ejemplo.com" value="${esc(val)}" autocomplete="email" />`;
      }

      default:
        return `<input id="field" type="text" value="${esc(val ?? '')}" placeholder="Escribe aquí…" />`;
    }
  }

  function bindField(step) {
    const { tipo_input, campo_clientes } = step;

    if (tipo_input === 'text' || tipo_input === 'number' || tipo_input === 'email') {
      const el = document.getElementById('field');
      el?.addEventListener('input', e => { S.answers[campo_clientes] = e.target.value; S.fieldErr = ''; });
      el?.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); onNext(step, S.step === visibleSteps().length - 1); }
      });
    }

    if (tipo_input === 'single_select' || tipo_input === 'boolean') {
      document.querySelectorAll('.opt,.bool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          S.answers[campo_clientes] = btn.dataset.v;
          S.fieldErr = '';
          onNext(step, S.step === visibleSteps().length - 1);
        });
      });
    }

    if (tipo_input === 'multi_select' || tipo_input === 'dynamic_zone_multi_select') {
      document.querySelectorAll('.chk').forEach(btn => {
        btn.addEventListener('click', () => {
          const cur = S.answers[campo_clientes] ? S.answers[campo_clientes].split(',').map(s => s.trim()) : [];
          const v   = btn.dataset.v;
          const idx = cur.indexOf(v);
          if (idx === -1) cur.push(v); else cur.splice(idx, 1);
          S.answers[campo_clientes] = cur.filter(Boolean).join(',');
          S.fieldErr = '';
          S.skipEnterAnim = true;
          render();
        });
      });
    }

    if (tipo_input === 'phone_prefix') {
      const selPrefijo = document.getElementById('prefijo');
      const inpNumero  = document.getElementById('telefonoNum');
      if (selPrefijo && S.answers.__prefijo === undefined) S.answers.__prefijo = selPrefijo.value;
      selPrefijo?.addEventListener('change', e => { S.answers.__prefijo = e.target.value; S.fieldErr = ''; });
      inpNumero?.addEventListener('input', e => {
        S.answers.__telefonoNum = e.target.value.replace(/[^0-9]/g, '');
        S.fieldErr = '';
      });
      inpNumero?.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); onNext(step, S.step === visibleSteps().length - 1); }
      });
    }
  }

  // ─── Navigation ──────────────────────────────────────────────────────────────

  function onBack() {
    if (S.step > 0) { S.direction = 'back'; S.step--; S.fieldErr = ''; render(); }
  }

  async function onNext(step, isLast) {
    if (step.tipo_input === 'email') {
      S.answers[step.campo_clientes] = String(S.answers[step.campo_clientes] ?? '').trim();
      if (!isValidEmail(S.answers[step.campo_clientes])) {
        S.fieldErr = 'Introduce un email valido para continuar.';
        S.skipEnterAnim = true;
        render();
        return;
      }
    }

    let empty;
    if (step.tipo_input === 'phone_prefix') {
      empty = !S.answers.__prefijo || !S.answers.__telefonoNum || S.answers.__telefonoNum.trim() === '';
    } else {
      const val = S.answers[step.campo_clientes];
      empty = val === undefined || val === null || String(val).trim() === '';
    }
    if (empty) { S.fieldErr = 'Por favor, responde esta pregunta antes de continuar.'; S.skipEnterAnim = true; render(); return; }

    if (isLast && !S.privacyAccepted) {
      S.fieldErr = 'Debes aceptar la Política de Privacidad para continuar.';
      S.skipEnterAnim = true;
      render();
      return;
    }

    S.fieldErr = '';
    if (isLast) { await submit(); }
    else        { S.direction = 'fwd'; S.step++; render(); }
  }

  async function submit() {
    S.submitting = true;
    S.skipEnterAnim = true;
    render();

    try {
      // Payload keyed by pregunta_id — valores siempre como string.
      // Las RPCs castean tipos internamente y solo aceptan preguntas
      // activas para el tenant correspondiente. Los pasos sintéticos
      // (nombre/teléfono del modo público) no tienen pregunta_id y se excluyen.
      const respuestas = {};
      visibleSteps().forEach(s => {
        if (!s.pregunta_id) return;
        const v = S.answers[s.campo_clientes];
        if (v === undefined || v === null) return;
        respuestas[s.pregunta_id] = String(v);
      });

      let formToken;
      let clienteId;
      if (S.mode === 'public') {
        const payload = {
          p_tenant_id:  S.tenantId,
          p_nombre:     S.answers.__nombre || null,
          p_respuestas: respuestas,
          p_privacidad_aceptada: S.privacyAccepted,
        };
        if (S.tieneWhatsapp) {
          S.telefono = Number(S.answers.__prefijo + S.answers.__telefonoNum);
          payload.p_prefijo  = S.answers.__prefijo;
          payload.p_telefono = S.telefono;
        } else {
          payload.p_prefijo  = null;
          payload.p_telefono = null;
          payload.p_email    = S.answers.__email.trim() || null;
        }
        const res = await sbRpc('crear_lead_publico', payload);
        formToken = res?.form_token;
        clienteId = res?.id;
      } else {
        const res = await sbRpc('submit_formulario', {
          p_token: S.token,
          p_respuestas: respuestas,
          p_privacidad_aceptada: S.privacyAccepted,
        });
        formToken = res?.form_token;
        clienteId = S.clienteId;
      }

      // Aviso al backend (WhatsApp al tenant + matching de propiedades).
      // El endpoint exige el token del cliente para autenticar la llamada;
      // sin él responde 401 y no se envía nada. Es best-effort respecto al
      // resultado (no bloquea la pantalla de éxito), pero el error se
      // registra siempre para poder detectarlo.
      if (N8N_WEBHOOK_URL && formToken) {
        fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: formToken, tenant_id: S.tenantId, telefono: S.telefono, cliente_id: clienteId }),
        }).then(r => {
          if (!r.ok) console.error('Aviso al tenant fallido:', r.status, r.statusText);
          return sbRpc('registrar_estado_webhook_formulario', {
            p_form_token: formToken,
            p_status: r.ok ? 'enviado' : 'error',
            p_error: r.ok ? null : `HTTP ${r.status} ${r.statusText}`,
          });
        }).catch(err => {
          console.error('Aviso al tenant fallido:', err);
          return sbRpc('registrar_estado_webhook_formulario', {
            p_form_token: formToken,
            p_status: 'error',
            p_error: String(err),
          });
        }).catch(() => {});
      }

      S.screen = 'success';
      render();
    } catch (err) {
      console.error(err);
      S.submitting = false;
      S.fieldErr = 'No se pudo enviar el formulario. Inténtalo de nuevo.';
      S.skipEnterAnim = true;
      render();
    }
  }

  // ─── Bootstrap ───────────────────────────────────────────────────────────────

  async function init() {
    render(); // loading

    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    // El slug puede venir como ?t=... (uso directo de formulario.html) o como
    // parte de la ruta /f/<slug> (el navegador nunca ve el rewrite interno de
    // Caddy que reescribe /f/<slug> a formulario.html?t=<slug>, así que hay
    // que leerlo también de la ruta visible).
    const pathMatch = window.location.pathname.match(/^\/f\/([^/]+)\/?$/);
    const slug = params.get('t') || (pathMatch ? pathMatch[1] : null);

    let tenantId;
    let tenantInfo = null;

    try {
      if (token) {
        // Modo lead (WhatsApp): el token ya identifica al cliente y su tenant.
        S.mode  = 'token';
        S.token = token;

        const rows = await sbRpc('get_cliente_by_token', { p_token: token });

        if (!rows.length)           { S.screen = 'error'; S.errorKey = 'notfound'; render(); return; }

        const c = rows[0];
        if (c.formulario_enviado)   { S.screen = 'error'; S.errorKey = 'used';     render(); return; }
        if (c.form_token_expira && new Date(c.form_token_expira) < new Date())
                                    { S.screen = 'error'; S.errorKey = 'expired';  render(); return; }

        tenantId   = c.tenant_id;
        S.telefono = c.telefono;
        S.clienteId = c.id;

        try {
          const info = await sbRpc('get_tenant_public_info', { p_tenant_id: tenantId });
          tenantInfo = Array.isArray(info) ? info[0] : info;
        } catch { tenantInfo = null; }
      } else if (slug) {
        // Modo público (link corto compartido, ej. Idealista): no hay cliente
        // todavía, el propio formulario pide nombre y teléfono al principio.
        S.mode = 'public';

        const info = await sbRpc('get_tenant_by_slug', { p_slug: slug });
        const row  = Array.isArray(info) ? info[0] : info;
        if (!row) { S.screen = 'error'; S.errorKey = 'notfound'; render(); return; }

        tenantId   = row.id;
        tenantInfo = row;
      } else {
        S.screen = 'error'; S.errorKey = 'notfound'; render(); return;
      }

      S.tenantId    = tenantId;
      S.tenantName  = tenantInfo?.nombre || 'Tu inmobiliaria';
      S.tenantEmail = tenantInfo?.email_contacto || '';
      S.tieneWhatsapp = S.mode === 'public' ? (tenantInfo?.tiene_whatsapp !== false) : true;

      // Preguntas activas del tenant
      const tp = await sbGet('tenant_preguntas', {
        select: 'pregunta_id,pregunta_texto_custom,orden',
        tenant_id: `eq.${tenantId}`,
        activa: 'eq.true',
        order: 'orden.asc',
      });

      if (!tp.length) { S.screen = 'error'; S.errorKey = 'generic'; render(); return; }

      // Catálogo de preguntas para esos IDs
      const ids      = tp.map(r => r.pregunta_id);
      const catalogo = await sbGet('preguntas_catalogo', {
        select: 'id,clave,campo_clientes,pregunta_texto,tipo_input,opciones',
        id: `in.(${ids.join(',')})`,
      });
      const catMap = Object.fromEntries(catalogo.map(p => [p.id, p]));

      // Construir pasos
      S.steps = tp.map(row => {
        const cat = catMap[row.pregunta_id];
        if (!cat) return null;
        return {
          pregunta_id:    row.pregunta_id,
          clave:          cat.clave,
          campo_clientes: cat.campo_clientes,
          textoMostrar:   row.pregunta_texto_custom || cat.pregunta_texto,
          tipo_input:     cat.tipo_input,
          opciones:       cat.opciones ?? [],
        };
      }).filter(Boolean);

      // Modo público: nombre y teléfono (o email, si el tenant no tiene
      // WhatsApp) van primero, no vienen del catálogo.
      if (S.mode === 'public') {
        if (S.tieneWhatsapp) {
          S.steps.unshift(
            { pregunta_id: null, clave: 'telefono_publico', campo_clientes: '__telefonoNum', textoMostrar: '¿Cuál es tu número de teléfono?', subtext: 'Te avisaremos por WhatsApp en cuanto tengamos opciones para ti. Nunca lo compartimos con terceros.', tipo_input: 'phone_prefix', opciones: [] },
            { pregunta_id: null, clave: 'nombre_publico',   campo_clientes: '__nombre',       textoMostrar: '¿Cómo te llamas?',                 subtext: 'Así podremos dirigirnos a ti correctamente.',                                                    tipo_input: 'text',         opciones: [] },
          );
        } else {
          S.steps.unshift(
            { pregunta_id: null, clave: 'email_publico', campo_clientes: '__email', textoMostrar: '¿Cuál es tu email?', subtext: 'Te enviaremos las opciones disponibles a este correo. Nunca lo compartimos con terceros.', tipo_input: 'email', opciones: [] },
            { pregunta_id: null, clave: 'nombre_publico', campo_clientes: '__nombre', textoMostrar: '¿Cómo te llamas?', subtext: 'Así podremos dirigirnos a ti correctamente.', tipo_input: 'text', opciones: [] },
          );
        }
      }

      // Zonas dinámicas para dynamic_zone_multi_select
      const dynamicos = S.steps.filter(s => s.tipo_input === 'dynamic_zone_multi_select');
      if (dynamicos.length) {
        try {
          const zonas = await sbRpc('get_zonas_disponibles', { p_tenant_id: tenantId });
          const opts = (Array.isArray(zonas) ? zonas : []).map(z => ({ value: z, label: z }));
          dynamicos.forEach(s => { s.opciones = opts; });
        } catch { /* si falla, se queda con opciones vacías */ }
      }

      S.screen = 'wizard';
      render();

    } catch (err) {
      console.error(err);
      S.screen = 'error';
      S.errorKey = 'generic';
      render();
    }
  }

  init();
</script>
</body>
</html>
